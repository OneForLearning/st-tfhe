[package]
name    = "dpeg_node"
version = { workspace = true }
edition = { workspace = true }

# Bibliothèque UNIQUE, utilisée par tous les hôpitaux (H1…H10).
# Aucun transport : le backend appelle ces fonctions et gère le réseau.
[lib]
name = "dpeg_node"
path = "src/lib.rs"

[dependencies]
dpeg_shared = { path = "../shared" }
num-bigint  = { workspace = true }
num-traits  = { workspace = true }
csv         = { workspace = true }

[workspace]
members  = ["shared", "node", "server", "demo"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"

[workspace.dependencies]
num-bigint  = { version = "0.4", features = ["rand", "serde"] }
num-traits  = "0.2"
num-integer = "0.1"
rand        = "0.8"
rand_core   = { version = "0.6", features = ["std"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
bincode     = "1"
zeroize     = "1"
sha2        = "0.10"
csv         = "1.3"
rayon       = "1.11"
unicode-normalization = "0.1"
# rug : binding GMP — opérations cryptographiques lourdes (modpow, mod_inverse).
# Prérequis macOS  : brew install gmp
# Prérequis Linux  : apt-get install libgmp-dev
rug         = { version = "1", features = ["integer"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
